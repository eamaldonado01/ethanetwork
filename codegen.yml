# codegen.yml
schema: "src/graphql/schema.graphql"
documents:
  - "src/graphql/operations/**/*.graphql"
  - 'src/graphql/fragments/*.graphql' 

generates:
  src/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      namingConvention:
        typeNames: keep
      withHooks: true
      scalars:
        DateTime: string

hooks:
  afterAllFileWrite:
    - prettier --write
require:
  - '@graphql-codegen/import-types-preset'  