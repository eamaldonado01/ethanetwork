# .github/workflows/main.yml
name: CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:

env:
  AWS_REGION: us-west-1
  ECR_REPO: odin-book
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      AUTH0_ISSUER_BASE_URL:    ${{ secrets.AUTH0_ISSUER_BASE_URL }}
      AUTH0_CLIENT_ID:          ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET:      ${{ secrets.AUTH0_CLIENT_SECRET }}
      AUTH0_SECRET:             ${{ secrets.AUTH0_SECRET }}
      AUTH0_AUDIENCE:           ${{ secrets.AUTH0_AUDIENCE }}
      NEXT_PUBLIC_AUTH0_BASE_URL: ${{ secrets.NEXT_PUBLIC_AUTH0_BASE_URL }}
      AUTH0_EMAIL:              ${{ secrets.AUTH0_EMAIL }}
      AUTH0_PW:                 ${{ secrets.AUTH0_PW }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint & unit + integration tests
        run: npm run test:cov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm start -p 3000

  deploy:
    needs: test-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}

      # ───────── Terraform Provision & Deploy ─────────

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -var="image_tag=${{ env.IMAGE_TAG }}" \
            -var="domain_name=${{ secrets.DOMAIN_NAME }}" \
            -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}" \
            -out=plan.out

      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve plan.out

      # ───────── Blue-Green Swap ─────────

      - name: Blue-Green Swap
        working-directory: infra/terraform
        run: |
          HTTP_LISTENER_ARN=$(terraform output -raw http_listener_arn)
          GREEN_TG_ARN=$(terraform output -raw green_tg_arn)
          ../scripts/blue-green-deploy.sh "$HTTP_LISTENER_ARN" "$GREEN_TG_ARN"
