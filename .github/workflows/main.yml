name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  AWS_REGION: us-west-1
  ECR_REPO: odin-book
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Lint & unit+integration tests
        run: npm run test:cov

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Cypress e2e
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm start
        env:
          AUTH0_EMAIL: ${{ secrets.AUTH0_EMAIL }}
          AUTH0_PW: ${{ secrets.AUTH0_PW }}

  deploy:
    needs: test-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build & push
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG .
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG
      
      - name: Deploy to ECS
        env:
          CLUSTER_NAME: odin-cluster
          SERVICE_NAME: odin-service
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment \
            --region $AWS_REGION