# ─── Scalars ────────────────────────────────────────────────────────────
scalar DateTime

# ─── Core types ─────────────────────────────────────────────────────────
type User {
  id: ID!
  username: String!
  email: String!
  name: String
  bio: String
  website: String
  github: String                 
  imageUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!

  followersCount: Int!
  followingCount: Int!

  # posts as a simple array (no args)
  posts: [Post!]!

  isFollowing: Boolean!
}

type Post {
  id: ID!
  author: User!
  content: String!
  imageUrl: String
  createdAt: DateTime!

  likeCount: Int!
  commentCount: Int!
  viewerHasLiked: Boolean!

  comments(first: Int = 10, after: ID): [Comment!]!
}

type Comment {
  id: ID!
  author: User!
  body: String!
  createdAt: DateTime!
}

# Cursor-based pagination for the global feed
type FeedEdge {
  cursor: ID!
  node: Post!
}

type FeedConnection {
  edges: [FeedEdge!]!
  hasNextPage: Boolean!
}

# ─── Root operations ────────────────────────────────────────────────────
type Query {
  me: User!
  user(username: String!): User
  users(search: String, first: Int = 20, after: ID): [User!]!

  feed(first: Int = 20, after: ID): FeedConnection!

  post(id: ID!): Post!
  postById(id: ID!): Post!          # ⬅︎ deprecated alias
  postsByLikes(first: Int = 20): [Post!]!
}

type Mutation {
  createPost(content: String!, imageUrl: String): Post!
  likePost(postId: ID!): Post!
  unlikePost(postId: ID!): Post!
  commentOnPost(postId: ID!, body: String!): Comment!
  followUser(userId: ID!): User!
  unfollowUser(userId: ID!): User!

  updateProfile(
    bio: String
    website: String
    github: String                
    imageUrl: String
  ): User!

  deletePost(postId: ID!): Boolean!
  deleteComment(commentId: ID!): Boolean!
}
